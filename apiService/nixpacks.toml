# Configuración de Nixpacks para el Backend .NET
# Nixpacks detectará automáticamente .NET 10 si está disponible en su repositorio de paquetes.

[phases.setup]
nixPkgs = ["dotnet-sdk_10"]

[phases.build]
cmds = ["dotnet publish InformeObras.csproj -c Release -o out"]

[start]
cmd = "dotnet out/InformeObras.dll"

[variables]
ASPNETCORE_URLS = "http://0.0.0.0:8080"
PORT = "8080"
